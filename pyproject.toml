[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jev-triage"
version = "0.1.0"
description = "Active-learning triage pipeline using TypeSafe Jev — route by confidence, log soft labels for local distillation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "jev-triage contributors" }]
keywords = ["jev", "typesafe", "active-learning", "data-curation", "soft-labels", "distillation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "typesafe-sdk>=0.7.0",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
jev-triage = "jev_triage.cli:main"

[project.urls]
Homepage = "https://github.com/ThyFriendlyFox/jev-triage"
Documentation = "https://github.com/ThyFriendlyFox/jev-triage#readme"
Repository = "https://github.com/ThyFriendlyFox/jev-triage"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
